<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#0B0E14" />
<link rel="manifest" href="/manifest.json" />
<title>Kharch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0B0E14;
    --bg-elevated: #131822;
    --bg-subtle: #1A2029;
    --border: #222A36;
    --border-strong: #2E3846;
    --fg: #F5F6F8;
    --fg-muted: #8E8E93;
    --fg-subtle: #5A6472;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-fg: #FFFFFF;

    /* Category palette — used for pills, chart, glow */
    --c-food: #F97316;
    --c-fuel: #22C55E;
    --c-groceries: #14B8A6;
    --c-entertainment: #A855F7;
    --c-shopping: #EC4899;
    --c-bills: #F59E0B;
    --c-transfer: #64748B;
    --c-other: #3B82F6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-feature-settings: 'ss01', 'cv01';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font-family: inherit; cursor: pointer; }

  .app {
    max-width: 480px;
    width: 100%;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    flex-shrink: 0;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: var(--accent-fg);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .header-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    border-color: var(--border-strong);
  }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn.active {
    background: rgba(220, 38, 38, 0.15);
    border-color: rgba(220, 38, 38, 0.4);
    color: #F87171;
  }

  /* ---------- SCROLL ---------- */
  .scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 20px 32px;
  }
  .scroll::-webkit-scrollbar { width: 0; background: transparent; }

  /* ---------- FILTERS ---------- */
  .filters {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    margin-bottom: 24px;
  }

  .filter-btn {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: transparent;
    color: var(--fg-subtle);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    border-radius: 9px;
    transition: background 150ms ease, color 150ms ease;
    min-height: 36px;
  }
  .filter-btn:hover { color: var(--fg); }
  .filter-btn.active {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- RING SECTION ---------- */
  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 28px;
    position: relative;
  }

  .ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
  }

  /* Always-on soft radial glow behind the ring */
  .ring-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(59, 130, 246, 0.18) 0%,
      rgba(168, 85, 247, 0.10) 35%,
      rgba(236, 72, 153, 0.06) 60%,
      transparent 75%
    );
    filter: blur(20px);
    pointer-events: none;
    z-index: 0;
  }

  .ring-wrap canvas {
    position: relative;
    z-index: 1;
    width: 100% !important;
    height: 100% !important;
    display: block;
    touch-action: none;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    z-index: 2;
  }

  .ring-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-subtle);
    margin-bottom: 6px;
  }

  .ring-amount {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TOOLTIP ---------- */
  .tooltip {
    margin-top: 20px;
    min-height: 44px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 150ms ease;
    font-size: 14px;
    pointer-events: none;
    max-width: 100%;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .tooltip-name { color: var(--fg-muted); font-weight: 500; }
  .tooltip-amount {
    color: var(--fg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .tooltip-percent {
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  /* ---------- SECTION HEAD ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .section-meta {
    font-size: 12px;
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TRANSACTION LIST ---------- */
  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tx-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    transition: background 150ms ease;
  }
  .tx-row:active { background: rgba(255, 255, 255, 0.06); }

  /* Category pill with 15% tint of its category color */
  .tx-badge {
    width: 40px;
    height: 40px;
    border-radius: 9999px;
    display: grid;
    place-items: center;
    font-size: 17px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
  }
  .tx-badge[data-cat="Food"]          { background: rgba(249, 115, 22, 0.15); }
  .tx-badge[data-cat="Fuel"]          { background: rgba(34, 197, 94, 0.15); }
  .tx-badge[data-cat="Groceries"]     { background: rgba(20, 184, 166, 0.15); }
  .tx-badge[data-cat="Entertainment"] { background: rgba(168, 85, 247, 0.15); }
  .tx-badge[data-cat="Shopping"]      { background: rgba(236, 72, 153, 0.15); }
  .tx-badge[data-cat="Bills"]         { background: rgba(245, 158, 11, 0.15); }
  .tx-badge[data-cat="Transfer"]      { background: rgba(100, 116, 139, 0.15); }
  .tx-badge[data-cat="Other"]         { background: rgba(59, 130, 246, 0.15); }

  .tx-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tx-cat {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-time {
    font-size: 12px;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }

  .tx-amt {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  /* Remove button — appears only in remove mode */
  .tx-remove {
    width: 32px;
    height: 32px;
    border-radius: 9999px;
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.35);
    color: #F87171;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 100ms ease;
  }
  .tx-remove:active { transform: scale(0.9); }
  .remove-mode .tx-remove { display: grid; }
  .remove-mode .tx-row { cursor: pointer; }

  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--fg-subtle);
    font-size: 14px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.06);
    border-radius: 16px;
  }

  /* ---------- SUBSCRIBE ---------- */
  .subscribe {
    margin-top: 24px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .subscribe.hidden { display: none; }
  .subscribe-body { flex: 1; min-width: 0; }
  .subscribe-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
    letter-spacing: -0.005em;
  }
  .subscribe-desc {
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.4;
  }
  .subscribe-btn {
    padding: 9px 14px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.005em;
    transition: background 150ms ease;
    min-height: 36px;
    flex-shrink: 0;
  }
  .subscribe-btn:hover { background: var(--accent-hover); }
  .subscribe-btn:active { transform: scale(0.97); }
  .subscribe-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- MODAL SHEET ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: #0F131B;
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 20px 28px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  }

  /* Small drag handle */
  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    margin: 0 auto 20px;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }
  .sheet-close:hover { background: rgba(255, 255, 255, 0.06); color: var(--fg); }

  /* Hero amount input */
  .hero-amount {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 0 28px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 24px;
  }
  .hero-amount .prefix {
    font-size: 28px;
    font-weight: 500;
    color: var(--fg-subtle);
    letter-spacing: -0.02em;
  }
  .hero-amount input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    width: 100%;
    max-width: 260px;
    font-family: inherit;
  }
  .hero-amount input::placeholder { color: #3A3F4A; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  /* Category chips — horizontal scroll */
  .cat-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 16px;
    margin: 0 -20px 8px;
    padding-left: 20px;
    padding-right: 20px;
    scrollbar-width: none;
  }
  .cat-chips::-webkit-scrollbar { display: none; }

  .cat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    color: var(--fg-muted);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.005em;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 150ms ease;
    min-height: 44px;
  }
  .cat-chip:active { transform: scale(0.96); }
  .cat-chip.selected {
    color: var(--fg);
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
  }
  .cat-chip[data-cat="Food"].selected          { background: rgba(249, 115, 22, 0.20); border-color: rgba(249, 115, 22, 0.5); }
  .cat-chip[data-cat="Fuel"].selected          { background: rgba(34, 197, 94, 0.20);  border-color: rgba(34, 197, 94, 0.5); }
  .cat-chip[data-cat="Groceries"].selected     { background: rgba(20, 184, 166, 0.20); border-color: rgba(20, 184, 166, 0.5); }
  .cat-chip[data-cat="Entertainment"].selected { background: rgba(168, 85, 247, 0.20); border-color: rgba(168, 85, 247, 0.5); }
  .cat-chip[data-cat="Shopping"].selected      { background: rgba(236, 72, 153, 0.20); border-color: rgba(236, 72, 153, 0.5); }
  .cat-chip[data-cat="Bills"].selected         { background: rgba(245, 158, 11, 0.20); border-color: rgba(245, 158, 11, 0.5); }
  .cat-chip[data-cat="Transfer"].selected      { background: rgba(100, 116, 139, 0.20); border-color: rgba(100, 116, 139, 0.5); }
  .cat-chip[data-cat="Other"].selected         { background: rgba(59, 130, 246, 0.20); border-color: rgba(59, 130, 246, 0.5); }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .row-2 input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--fg);
    font-size: 15px;
    font-family: inherit;
    min-height: 48px;
  }
  .row-2 input:focus { outline: none; border-color: var(--accent); }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-secondary {
    padding: 14px 20px;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font-size: 15px;
    font-weight: 500;
    min-height: 52px;
    border-radius: 14px;
  }
  .btn-secondary:hover { color: var(--fg); }
  .btn-primary {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: var(--accent-fg);
    font-size: 15px;
    font-weight: 600;
    min-height: 52px;
    transition: background 150ms ease;
    letter-spacing: -0.005em;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 400px) {
    .ring-wrap { width: 200px; height: 200px; }
    .ring-amount { font-size: 26px; }
    .hero-amount input { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">K</div>
      <span class="brand-name">Kharch</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="removeToggle" aria-label="Toggle remove mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </button>
      <button class="icon-btn" id="addBtn" aria-label="Add transaction">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="scroll">

    <div class="filters" role="tablist" aria-label="Time range">
      <button class="filter-btn" data-days="7" role="tab">1W</button>
      <button class="filter-btn" data-days="14" role="tab">2W</button>
      <button class="filter-btn active" data-days="30" role="tab">4W</button>
      <button class="filter-btn" data-days="90" role="tab">3M</button>
    </div>

    <section class="ring-section">
      <div class="ring-wrap">
        <canvas id="spendingChart"></canvas>
        <div class="ring-center">
          <div class="ring-label">Total spent</div>
          <div class="ring-amount" id="totalAmount">Rs 0</div>
        </div>
      </div>
      <div class="tooltip" id="tooltip">
        <span class="tooltip-dot" id="tooltipDot"></span>
        <span class="tooltip-name" id="tooltipName">—</span>
        <span class="tooltip-amount" id="tooltipAmount">Rs 0</span>
        <span class="tooltip-percent" id="tooltipPercent"></span>
      </div>
    </section>

    <div class="section-head">
      <span class="section-title">Transactions</span>
      <span class="section-meta" id="txCount">0</span>
    </div>

    <div class="tx-list" id="transactionList">
      <div class="empty">Loading…</div>
    </div>

    <div class="subscribe hidden" id="subscribeCard">
      <div class="subscribe-body">
        <div class="subscribe-title">Enable notifications</div>
        <div class="subscribe-desc">Get notified when a new transaction arrives so you can categorize it right away.</div>
      </div>
      <button class="subscribe-btn" id="subscribeBtn">Enable</button>
    </div>

  </main>

</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">Add transaction</span>
      <button class="sheet-close" id="sheetClose" aria-label="Close">×</button>
    </div>

    <div class="hero-amount">
      <span class="prefix">Rs</span>
      <input type="number" id="mAmount" inputmode="decimal" step="0.01" placeholder="0" />
    </div>

    <label class="field-label">Category</label>
    <div class="cat-chips" id="catChips">
      <button class="cat-chip selected" data-cat="Food">🍔 Food</button>
      <button class="cat-chip" data-cat="Fuel">⛽ Fuel</button>
      <button class="cat-chip" data-cat="Groceries">🛒 Groceries</button>
      <button class="cat-chip" data-cat="Entertainment">📺 Entertainment</button>
      <button class="cat-chip" data-cat="Shopping">🛍️ Shopping</button>
      <button class="cat-chip" data-cat="Bills">🏠 Bills</button>
      <button class="cat-chip" data-cat="Transfer">💸 Transfer</button>
      <button class="cat-chip" data-cat="Other">❓ Other</button>
    </div>

    <div class="row-2">
      <div class="field">
        <label class="field-label" for="mDate">Date</label>
        <input type="date" id="mDate" />
      </div>
      <div class="field">
        <label class="field-label" for="mTime">Time</label>
        <input type="time" id="mTime" />
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn-secondary" id="sheetCancel">Cancel</button>
      <button class="btn-primary" id="sheetSave">Save</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#F97316', '#22C55E', '#14B8A6', '#A855F7', '#EC4899', '#F59E0B', '#64748B', '#3B82F6'];
let chart = null;
let currentDays = 30;
let removeMode = false;

const CAT_EMOJI = {
  Food: '🍔', Fuel: '⛽', Groceries: '🛒', Entertainment: '📺',
  Shopping: '🛍️', Bills: '🏠', Transfer: '💸', Other: '❓'
};

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js')
    .then(r => console.log('SW registered'))
    .catch(e => console.log('SW failed', e));
}

/* ---------- HELPERS ---------- */
function fmtRs(n) {
  return 'Rs ' + Number(n || 0).toLocaleString();
}

function emojiFor(cat) {
  return CAT_EMOJI[cat] || '📌';
}

/* Human-friendly date formatting */
function fmtWhen(dateStr, timeStr) {
  // dateStr expected as YYYY-MM-DD; timeStr as HH:MM
  try {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = timeStr.split(':').map(Number);
    const dt = new Date(y, m - 1, d, hh, mm);
    const now = new Date();

    const sameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();

    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);

    const t = dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

    if (sameDay(dt, now)) return `Today, ${t}`;
    if (sameDay(dt, yesterday)) return `Yesterday, ${t}`;

    const datePart = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `${datePart}, ${t}`;
  } catch (e) {
    return `${dateStr} · ${timeStr}`;
  }
}

/* ---------- CHART ---------- */
const tooltipEl = document.getElementById('tooltip');
const tooltipDot = document.getElementById('tooltipDot');
const tooltipName = document.getElementById('tooltipName');
const tooltipAmount = document.getElementById('tooltipAmount');
const tooltipPercent = document.getElementById('tooltipPercent');

function showTooltip(label, value, total, index) {
  const pct = total > 0 ? ((value / total) * 100).toFixed(1) : '0';
  tooltipDot.style.background = COLORS[index % COLORS.length];
  tooltipName.textContent = label;
  tooltipAmount.textContent = fmtRs(value);
  tooltipPercent.textContent = pct + '%';
  tooltipEl.classList.add('visible');
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

async function loadChart(days) {
  try {
    const res = await fetch(`/api/spending?days=${days}`);
    const data = await res.json();

    document.getElementById('totalAmount').textContent = fmtRs(data.total);

    const ctx = document.getElementById('spendingChart').getContext('2d');

    if (chart) {
      chart.data.labels = data.labels;
      chart.data.datasets[0].data = data.values;
      chart.data.datasets[0].backgroundColor = data.labels.map((_, i) => COLORS[i % COLORS.length]);
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.labels,
          datasets: [{
            data: data.values,
            backgroundColor: data.labels.map((_, i) => COLORS[i % COLORS.length]),
            borderColor: '#0B0E14',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '74%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          onHover: (evt, els) => {
            if (els.length > 0) {
              const i = els[0].index;
              const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
              showTooltip(chart.data.labels[i], chart.data.datasets[0].data[i], total, i);
            } else {
              hideTooltip();
            }
          }
        }
      });
    }
  } catch (err) {
    console.error('Chart error:', err);
    document.getElementById('totalAmount').textContent = 'Err';
  }
}

/* ---------- TRANSACTIONS ---------- */
async function loadTransactions(days) {
  const list = document.getElementById('transactionList');
  try {
    const res = await fetch(`/api/transactions?days=${days}`);
    const tx = await res.json();

    document.getElementById('txCount').textContent = tx.length + (tx.length === 1 ? ' entry' : ' entries');

    if (!tx || tx.length === 0) {
      list.innerHTML = '<div class="empty">No transactions yet</div>';
      return;
    }

    list.innerHTML = tx.map(t => `
      <div class="tx-row">
        <div class="tx-badge" data-cat="${t.category || 'Other'}">${emojiFor(t.category)}</div>
        <div class="tx-info">
          <div class="tx-cat">${t.category || 'Uncategorized'}</div>
          <div class="tx-time">${fmtWhen(t.date, t.time)}</div>
        </div>
        <div class="tx-amt">${fmtRs(t.amount)}</div>
        <button class="tx-remove" data-id="${t.id}" aria-label="Remove transaction">×</button>
      </div>
    `).join('');

    // Wire up delete buttons
    list.querySelectorAll('.tx-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTransaction(btn.dataset.id);
      });
    });
  } catch (err) {
    console.error('Tx error:', err);
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

async function deleteTransaction(id) {
  if (!confirm('Delete this transaction?')) return;
  try {
    const res = await fetch(`/api/transaction/${id}`, { method: 'DELETE' });
    if (res.ok) {
      await loadAll(currentDays);
    } else {
      alert('Failed to delete');
    }
  } catch (err) {
    alert('Failed to delete');
  }
}

/* ---------- LOAD ---------- */
async function loadAll(days) {
  currentDays = days;
  await Promise.all([loadChart(days), loadTransactions(days)]);
}

/* ---------- FILTERS ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadAll(parseInt(btn.dataset.days, 10));
  });
});

/* ---------- REMOVE MODE ---------- */
const app = document.getElementById('app');
const removeToggle = document.getElementById('removeToggle');
removeToggle.addEventListener('click', () => {
  removeMode = !removeMode;
  removeToggle.classList.toggle('active', removeMode);
  app.classList.toggle('remove-mode', removeMode);
});

/* ---------- MODAL ---------- */
const overlay = document.getElementById('overlay');

function openSheet() {
  const now = new Date();
  document.getElementById('mDate').value = now.toISOString().split('T')[0];
  document.getElementById('mTime').value = now.toTimeString().slice(0, 5);
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('mAmount').focus(), 100);
}

function closeSheet() {
  overlay.classList.remove('open');
  document.getElementById('mAmount').value = '';
}

document.getElementById('addBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeSheet(); });

/* Category chips */
document.querySelectorAll('.cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
});

document.getElementById('sheetSave').addEventListener('click', async () => {
  const amount = document.getElementById('mAmount').value;
  const selectedChip = document.querySelector('.cat-chip.selected');
  const category = selectedChip ? selectedChip.dataset.cat : 'Other';
  const date = document.getElementById('mDate').value;
  const time = document.getElementById('mTime').value;

  if (!amount || !date || !time) {
    alert('Please fill in amount, date and time.');
    return;
  }

  const btn = document.getElementById('sheetSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch('/api/add_transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, category, date, time })
    });
    const data = await res.json();
    if (data.success) {
      closeSheet();
      await loadAll(currentDays);
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
    }
  } catch (err) {
    alert('Failed to save.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

/* ---------- PUSH SUBSCRIPTION ---------- */
const subscribeCard = document.getElementById('subscribeCard');
const subscribeBtn = document.getElementById('subscribeBtn');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();

  if (existing) {
    subscribeCard.classList.add('hidden');
    return;
  }

  subscribeCard.classList.remove('hidden');

  subscribeBtn.addEventListener('click', async () => {
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'Enabling…';

    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        subscribeBtn.disabled = false;
        subscribeBtn.textContent = 'Enable';
        return;
      }

      const keyRes = await fetch('/vapid-public-key');
      const keyData = await keyRes.json();

      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
      });

      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub)
      });

      subscribeCard.classList.add('hidden');
    } catch (err) {
      console.error('Push subscribe failed:', err);
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = 'Enable';
    }
  });
}

/* ---------- INIT ---------- */
loadAll(30);
initPush();
</script>

</body>
</html>
