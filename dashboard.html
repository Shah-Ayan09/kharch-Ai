<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#0B0E14" />
<link rel="manifest" href="/manifest.json" />
<title>Kharch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0B0E14;
    --bg-elevated: #131822;
    --bg-subtle: #1A2029;
    --border: #222A36;
    --border-strong: #2E3846;
    --fg: #F5F6F8;
    --fg-muted: #8E8E93;
    --fg-subtle: #5A6472;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-fg: #FFFFFF;
    --danger: #DC2626;
    --danger-fg: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  button { font-family: inherit; cursor: pointer; }

  .app {
    max-width: 480px;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 4px 0;
    background: transparent;
    border: none;
    pointer-events: none;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: var(--accent-fg);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    position: relative;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    border-color: var(--border-strong);
  }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .icon-btn .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg);
    opacity: 0;
    transform: scale(0);
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .icon-btn.has-pending .badge {
    opacity: 1;
    transform: scale(1);
  }
  .icon-btn.pulse .badge {
    animation: pulse 1s ease-in-out 6;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
    50% { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
  }

  /* ---------- FIXED TOP ---------- */
  .fixed-top {
    flex-shrink: 0;
    padding: 0 20px;
  }

  .filters {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .filter-btn {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: transparent;
    color: var(--fg-subtle);
    font-size: 13px;
    font-weight: 500;
    border-radius: 9px;
    transition: background 150ms ease, color 150ms ease;
    min-height: 36px;
  }
  .filter-btn:hover { color: var(--fg); }
  .filter-btn.active {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 20px;
    position: relative;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .ring-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(59, 130, 246, 0.18) 0%,
      rgba(168, 85, 247, 0.10) 35%,
      rgba(236, 72, 153, 0.06) 60%,
      transparent 75%
    );
    filter: blur(20px);
    pointer-events: none;
    z-index: 0;
  }

  .ring-wrap canvas {
    position: relative;
    z-index: 1;
    width: 100% !important;
    height: 100% !important;
    display: block;
    touch-action: none;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    z-index: 2;
  }

  .ring-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-subtle);
    margin-bottom: 6px;
  }

  .ring-amount {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .tooltip {
    margin-top: 16px;
    min-height: 40px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 150ms ease;
    font-size: 13px;
    pointer-events: none;
    max-width: 100%;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .tooltip-name { color: var(--fg-muted); font-weight: 500; }
  .tooltip-amount {
    color: var(--fg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .tooltip-percent {
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }

  /* ---------- TRANSACTION SECTION ---------- */
  .tx-section {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 20px 20px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .section-meta {
    font-size: 12px;
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  .tx-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .tx-scroll::-webkit-scrollbar { width: 0; background: transparent; }

  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 20px;
  }

  /* Swipe container: clips the row as it slides */
  .tx-swipe {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
  }

  /* The swipe hint text sits behind the row */
  .tx-swipe-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: #FFFFFF;
    background: #2A3242;
    transition: background 120ms linear;
    pointer-events: none;
    text-align: center;
    padding: 0 16px;
  }
  .tx-swipe-hint.blue { background: var(--accent); }
  .tx-swipe-hint.red  { background: var(--danger); }

  /* The row itself */
  .tx-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    position: relative;
    z-index: 1;
    transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    touch-action: pan-y;
    will-change: transform;
  }
  .tx-row.no-anim { transition: none; }

  .tx-badge {
    width: 40px;
    height: 40px;
    border-radius: 9999px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: #FFFFFF;
  }
  .tx-badge svg {
    width: 20px;
    height: 20px;
    stroke: #FFFFFF;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tx-badge[data-cat="Food"]          { background: linear-gradient(135deg, #FB923C, #EA580C); }
  .tx-badge[data-cat="Mart"]          { background: linear-gradient(135deg, #4ADE80, #16A34A); }
  .tx-badge[data-cat="Groceries"]     { background: linear-gradient(135deg, #2DD4BF, #0D9488); }
  .tx-badge[data-cat="Entertainment"] { background: linear-gradient(135deg, #C084FC, #9333EA); }
  .tx-badge[data-cat="Shopping"]      { background: linear-gradient(135deg, #F472B6, #DB2777); }
  .tx-badge[data-cat="Bills"]         { background: linear-gradient(135deg, #FBBF24, #D97706); }
  .tx-badge[data-cat="Transfer"]      { background: linear-gradient(135deg, #94A3B8, #475569); }
  .tx-badge[data-cat="Other"]         { background: linear-gradient(135deg, #60A5FA, #2563EB); }
  .tx-badge[data-cat="Uncategorized"] { background: linear-gradient(135deg, #6B7280, #374151); }

  .tx-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .tx-cat {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-time {
    font-size: 12px;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }

  .tx-amt {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--fg-subtle);
    font-size: 14px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.06);
    border-radius: 16px;
  }

  /* ---------- SUBSCRIBE ---------- */
  .subscribe {
    margin-top: 16px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .subscribe.hidden { display: none; }
  .subscribe-body { flex: 1; min-width: 0; }
  .subscribe-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
  }
  .subscribe-desc {
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.4;
  }
  .subscribe-btn {
    padding: 9px 14px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    min-height: 36px;
    flex-shrink: 0;
  }

  /* ---------- SHEETS ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: #0F131B;
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 20px 28px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  }

  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    margin: 0 auto 20px;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }
  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }

  .hero-amount {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 0 28px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 24px;
  }
  .hero-amount .prefix {
    font-size: 28px;
    font-weight: 500;
    color: var(--fg-subtle);
  }
  .hero-amount input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    width: 100%;
    max-width: 260px;
    font-family: inherit;
  }
  .hero-amount input::placeholder { color: #3A3F4A; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  .cat-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 16px;
    margin: 0 -20px 8px;
    padding-left: 20px;
    padding-right: 20px;
    scrollbar-width: none;
  }
  .cat-chips::-webkit-scrollbar { display: none; }

  .cat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    color: var(--fg-muted);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 150ms ease;
    min-height: 44px;
  }
  .cat-chip:active { transform: scale(0.96); }
  .cat-chip.selected { color: var(--fg); border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); }
  .cat-chip[data-cat="Food"].selected          { background: rgba(249, 115, 22, 0.20); border-color: rgba(249, 115, 22, 0.5); }
  .cat-chip[data-cat="Mart"].selected          { background: rgba(34, 197, 94, 0.20);  border-color: rgba(34, 197, 94, 0.5); }
  .cat-chip[data-cat="Groceries"].selected     { background: rgba(20, 184, 166, 0.20); border-color: rgba(20, 184, 166, 0.5); }
  .cat-chip[data-cat="Entertainment"].selected { background: rgba(168, 85, 247, 0.20); border-color: rgba(168, 85, 247, 0.5); }
  .cat-chip[data-cat="Shopping"].selected      { background: rgba(236, 72, 153, 0.20); border-color: rgba(236, 72, 153, 0.5); }
  .cat-chip[data-cat="Bills"].selected         { background: rgba(245, 158, 11, 0.20); border-color: rgba(245, 158, 11, 0.5); }
  .cat-chip[data-cat="Transfer"].selected      { background: rgba(100, 116, 139, 0.20); border-color: rgba(100, 116, 139, 0.5); }
  .cat-chip[data-cat="Other"].selected         { background: rgba(59, 130, 246, 0.20); border-color: rgba(59, 130, 246, 0.5); }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .row-2 input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--fg);
    font-size: 15px;
    font-family: inherit;
    min-height: 48px;
  }
  .row-2 input:focus { outline: none; border-color: var(--accent); }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-secondary {
    padding: 14px 20px;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font-size: 15px;
    font-weight: 500;
    min-height: 52px;
    border-radius: 14px;
  }
  .btn-secondary:hover { color: var(--fg); }
  .btn-primary {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: var(--accent-fg);
    font-size: 15px;
    font-weight: 600;
    min-height: 52px;
    transition: background 150ms ease;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- PENDING LIST ---------- */
  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pending-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    color: var(--fg);
    text-decoration: none;
    transition: background 150ms ease;
  }
  .pending-row:hover { background: rgba(255, 255, 255, 0.06); }

  .pending-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }

  .pending-amt {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .pending-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pending-time {
    font-size: 12px;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }
  .pending-hint {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }
  .pending-x {
    width: 32px;
    height: 32px;
    border-radius: 9999px;
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.35);
    color: #F87171;
    display: grid;
    place-items: center;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 100ms ease;
  }
  .pending-x:active { transform: scale(0.9); }

  @media (max-width: 400px) {
    .ring-wrap { width: 190px; height: 190px; }
    .ring-amount { font-size: 24px; }
    .hero-amount input { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">K</div>
      <span class="brand-name">Kharch</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="inboxBtn" aria-label="Uncategorized transactions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
        <span class="badge"></span>
      </button>

      <button class="icon-btn" id="addBtn" aria-label="Add transaction">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <div class="fixed-top">
    <div class="filters" role="tablist">
      <button class="filter-btn" data-days="7" role="tab">1W</button>
      <button class="filter-btn" data-days="14" role="tab">2W</button>
      <button class="filter-btn active" data-days="30" role="tab">4W</button>
      <button class="filter-btn" data-days="90" role="tab">3M</button>
    </div>

    <section class="ring-section">
      <div class="ring-wrap">
        <canvas id="spendingChart"></canvas>

<script>
const COLORS = ['#F97316', '#22C55E', '#14B8A6', '#A855F7', '#EC4899', '#F59E0B', '#64748B', '#3B82F6'];
let chart = null;
let currentDays = 30;

/* SVG icons per category (line art, 2px stroke) */
const CAT_ICON = {
  Food:          '<svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 3 3v8"/><path d="M7 3v7"/><path d="M10 3v7"/><path d="M17 3c-1.5 2-2 4-2 7 0 2 1 3 2 3v8"/></svg>',
  Mart:          '<svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  Groceries:     '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  Entertainment: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>',
  Shopping:      '<svg viewBox="0 0 24 24"><path d="M20.59 13.41 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  Bills:         '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16l3-2 3 2 3-2 3 2 3-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
  Transfer:      '<svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3"/><path d="M17 17H6l3 3"/></svg>',
  Other:         '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  Uncategorized: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
};

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(e => console.log(e));
}

/* ---------- HELPERS ---------- */
function fmtRs(n) {
  return 'Rs ' + Number(n || 0).toLocaleString();
}
function iconFor(cat) {
  return CAT_ICON[cat] || CAT_ICON.Other;
}
function fmtWhen(dateStr, timeStr) {
  try {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = timeStr.split(':').map(Number);
    const dt = new Date(y, m - 1, d, hh, mm);
    const now = new Date();
    const sameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    const t = dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (sameDay(dt, now)) return `Today, ${t}`;
    if (sameDay(dt, yesterday)) return `Yesterday, ${t}`;
    return `${dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, ${t}`;
  } catch (e) {
    return `${dateStr} · ${timeStr}`;
  }
}
function haptic() {
  if (navigator.vibrate) navigator.vibrate(10);
}

/* ---------- CHART + TOOLTIP ---------- */
const tooltipEl = document.getElementById('tooltip');
const tooltipDot = document.getElementById('tooltipDot');
const tooltipName = document.getElementById('tooltipName');
const tooltipAmount = document.getElementById('tooltipAmount');
const tooltipPercent = document.getElementById('tooltipPercent');
let activeIndex = null;

function showTooltip(index) {
  if (!chart) return;
  const label = chart.data.labels[index];
  const value = chart.data.datasets[0].data[index];
  const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
  const pct = total > 0 ? ((value / total) * 100).toFixed(1) : '0';
  tooltipDot.style.background = COLORS[index % COLORS.length];
  tooltipName.textContent = label;
  tooltipAmount.textContent = fmtRs(value);
  tooltipPercent.textContent = pct + '%';
  tooltipEl.classList.add('visible');
  activeIndex = index;
}
function hideTooltip() {
  tooltipEl.classList.remove('visible');
  activeIndex = null;
}
function toggleTooltip(index) {
  if (activeIndex === index) hideTooltip();
  else showTooltip(index);
}

async function loadChart(days) {
  try {
    const res = await fetch(`/api/spending?days=${days}`);
    const data = await res.json();
    document.getElementById('totalAmount').textContent = fmtRs(data.total);
    const ctx = document.getElementById('spendingChart').getContext('2d');
    if (chart) {
      chart.data.labels = data.labels;
      chart.data.datasets[0].data = data.values;
      chart.data.datasets[0].backgroundColor = data.labels.map((_, i) => COLORS[i % COLORS.length]);
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.labels,
          datasets: [{
            data: data.values,
            backgroundColor: data.labels.map((_, i) => COLORS[i % COLORS.length]),
            borderColor: '#0B0E14',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '74%',
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          onClick: (evt, els) => {
            if (els.length > 0) toggleTooltip(els[0].index);
            else hideTooltip();
          }
        }
      });
    }
  } catch (err) {
    console.error(err);
  }
}

/* ---------- TRANSACTIONS ---------- */
let currentTx = [];

async function loadTransactions(days) {
  const list = document.getElementById('transactionList');
  try {
    const res = await fetch(`/api/transactions?days=${days}`);
    const tx = await res.json();
    currentTx = tx;
    document.getElementById('txCount').textContent = tx.length + (tx.length === 1 ? ' entry' : ' entries');
    if (!tx || tx.length === 0) {
      list.innerHTML = '<div class="empty">No transactions yet</div>';
      return;
    }
    list.innerHTML = tx.map(t => {
      const cat = t.category || 'Uncategorized';
      return `
        <div class="tx-swipe" data-id="${t.id}">
          <div class="tx-swipe-hint" data-hint>—</div>
          <div class="tx-row" data-id="${t.id}">
            <div class="tx-badge" data-cat="${cat}">${iconFor(cat)}</div>
            <div class="tx-info">
              <div class="tx-cat">${cat}</div>
              <div class="tx-time">${fmtWhen(t.date, t.time)}</div>
            </div>
            <div class="tx-amt">${fmtRs(t.amount)}</div>
          </div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.tx-swipe').forEach(swipe => {
      attachSwipe(swipe);
    });
  } catch (err) {
    console.error(err);
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

/* ---------- SWIPE SYSTEM ---------- */
let openSwipe = null;

function attachSwipe(swipeEl) {
  const rowEl = swipeEl.querySelector('.tx-row');
  const hintEl = swipeEl.querySelector('[data-hint]');
  const txId = swipeEl.dataset.id;

  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let dragging = false;
  let lockedDirection = null;
  let passedThreshold1 = false;
  let passedThreshold2 = false;

  const threshold1 = () => window.innerWidth * 0.33;
  const threshold2 = () => window.innerWidth * 0.66;

  const resetHint = () => {
    hintEl.textContent = 'Swipe to change or delete';
    hintEl.classList.remove('blue', 'red');
  };

  const resetRow = (animate = true) => {
    if (!animate) rowEl.classList.add('no-anim');
    rowEl.style.transform = 'translateX(0px)';
    if (!animate) {
      void rowEl.offsetWidth;
      rowEl.classList.remove('no-anim');
    }
    resetHint();
    currentX = 0;
    passedThreshold1 = false;
    passedThreshold2 = false;
  };

  const start = (e) => {
    if (openSwipe && openSwipe !== swipeEl) {
      const other = openSwipe;
      openSwipe = null;
      other.dispatchEvent(new CustomEvent('swipe-reset'));
    }
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX;
    startY = t.clientY;
    dragging = false;
    lockedDirection = null;
  };

  const move = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    // Determine direction on first significant movement
    if (!lockedDirection) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) lockedDirection = 'h';
      else if (Math.abs(dy) > 8) lockedDirection = 'v';
    }
    if (lockedDirection !== 'h') return;
    if (e.cancelable) e.preventDefault();

    dragging = true;
    currentX = Math.max(0, dx); // only swipe right

    // Cap at 100%
    const cap = window.innerWidth;
    currentX = Math.min(currentX, cap);

    rowEl.classList.add('no-anim');
    rowEl.style.transform = `translateX(${currentX}px)`;
    rowEl.classList.remove('no-anim');

    // Threshold 1 (33%)
    if (!passedThreshold1 && currentX >= threshold1()) {
      passedThreshold1 = true;
      haptic();
    }
    if (currentX < threshold1()) passedThreshold1 = false;

    // Threshold 2 (66%)
    if (!passedThreshold2 && currentX >= threshold2()) {
      passedThreshold2 = true;
      haptic();
    }
    if (currentX < threshold2()) passedThreshold2 = false;

    // Update hint text + color
    if (currentX >= threshold2()) {
      hintEl.textContent = 'Swipe completely to delete transaction';
      hintEl.classList.add('red');
      hintEl.classList.remove('blue');
    } else if (currentX >= threshold1()) {
      hintEl.textContent = 'Release to change category';
      hintEl.classList.add('blue');
      hintEl.classList.remove('red');
    } else {
      hintEl.textContent = 'Swipe to change or delete';
      hintEl.classList.remove('blue', 'red');
    }
  };

  const end = () => {
    if (!dragging) {
      resetRow();
      return;
    }
    const was2 = currentX >= threshold2();
    const was1 = currentX >= threshold1();
    const finalX = currentX;

    resetRow(true);
    openSwipe = null;

    if (was2) {
      setTimeout(() => deleteTransaction(txId), 220);
    } else if (was1) {
      setTimeout(() => openMoveSheet(txId), 220);
    }
  };

  rowEl.addEventListener('touchstart', start, { passive: true });
  rowEl.addEventListener('touchmove', move, { passive: false });
  rowEl.addEventListener('touchend', end);
  rowEl.addEventListener('touchcancel', end);

  rowEl.addEventListener('mousedown', start);
  rowEl.addEventListener('mousemove', move);
  rowEl.addEventListener('mouseup', end);
  rowEl.addEventListener('mouseleave', end);

  swipeEl.addEventListener('swipe-reset', () => resetRow(true));
}

/* ---------- DELETE ---------- */
async function deleteTransaction(id) {
  if (!confirm('Remove this transaction?')) return;
  try {
    const res = await fetch(`/api/transaction/${id}`, { method: 'DELETE' });
    if (res.ok) {
      await loadAll(currentDays);
      await refreshPending();
    } else {
      alert('Failed to remove');
    }
  } catch (err) {
    alert('Failed to remove');
  }
}

/* ---------- MOVE SHEET ---------- */
const moveOverlay = document.getElementById('moveOverlay');
let moveTxId = null;

function openMoveSheet(id) {
  const tx = currentTx.find(t => String(t.id) === String(id));
  moveTxId = id;

  if (tx) {
    document.getElementById('moveAmount').textContent = fmtRs(tx.amount);
    document.getElementById('moveMeta').textContent = fmtWhen(tx.date, tx.time);
    document.querySelectorAll('#moveCatChips .cat-chip').forEach(c => {
      c.classList.toggle('selected', c.dataset.cat === (tx.category || ''));
    });
  } else {
    document.getElementById('moveAmount').textContent = '—';
    document.getElementById('moveMeta').textContent = '';
  }

  moveOverlay.classList.add('open');
}

function closeMoveSheet() {
  moveOverlay.classList.remove('open');
  moveTxId = null;
}

document.getElementById('moveClose').addEventListener('click', closeMoveSheet);
document.getElementById('moveCancel').addEventListener('click', closeMoveSheet);
moveOverlay.addEventListener('click', (e) => { if (e.target === moveOverlay) closeMoveSheet(); });

document.querySelectorAll('#moveCatChips .cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#moveCatChips .cat-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
});

document.getElementById('moveSave').addEventListener('click', async () => {
  const sel = document.querySelector('#moveCatChips .cat-chip.selected');
  if (!sel || !moveTxId) return;
  const btn = document.getElementById('moveSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await fetch('/api/update_category', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transaction_id: moveTxId, category: sel.dataset.cat })
    });
    closeMoveSheet();
    await loadAll(currentDays);
    await refreshPending();
  } catch (err) {
    alert('Failed to change');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Change category';
  }
});

/* ---------- LOAD ---------- */
async function loadAll(days) {
  currentDays = days;
  await Promise.all([loadChart(days), loadTransactions(days)]);
}

/* ---------- FILTERS ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadAll(parseInt(btn.dataset.days, 10));
  });
});

/* ---------- ADD SHEET ---------- */
const overlay = document.getElementById('overlay');

function openSheet() {
  const now = new Date();
  document.getElementById('mDate').value = now.toISOString().split('T')[0];
  document.getElementById('mTime').value = now.toTimeString().slice(0, 5);
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('mAmount').focus(), 100);
}
function closeSheet() {
  overlay.classList.remove('open');
  document.getElementById('mAmount').value = '';
}
document.getElementById('addBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

document.querySelectorAll('#catChips .cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#catChips .cat-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
});

document.getElementById('sheetSave').addEventListener('click', async () => {
  const amount = document.getElementById('mAmount').value;
  const sel = document.querySelector('#catChips .cat-chip.selected');
  const category = sel ? sel.dataset.cat : 'Other';
  const date = document.getElementById('mDate').value;
  const time = document.getElementById('mTime').value;
  if (!amount || !date || !time) { alert('Please fill in amount, date and time.'); return; }
  const btn = document.getElementById('sheetSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/add_transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, category, date, time })
    });
    const data = await res.json();
    if (data.success) {
      closeSheet();
      await loadAll(currentDays);
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
    }
  } catch (err) {
    alert('Failed to save.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

/* ---------- PENDING LIST ---------- */
const inboxBtn = document.getElementById('inboxBtn');
const pendingOverlay = document.getElementById('pendingOverlay');

async function refreshPending() {
  try {
    const res = await fetch('/api/pending');
    const pending = await res.json();
    if (pending && pending.length > 0) {
      const wasHidden = !inboxBtn.classList.contains('has-pending');
      inboxBtn.classList.add('has-pending');
      if (wasHidden) {
        inboxBtn.classList.add('pulse');
        setTimeout(() => inboxBtn.classList.remove('pulse'), 6000);
      }
    } else {
      inboxBtn.classList.remove('has-pending');
      inboxBtn.classList.remove('pulse');
    }
  } catch (err) {
    console.error('Pending check failed:', err);
  }
}

async function loadPendingList() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch('/api/pending');
    const pending = await res.json();
    if (!pending || pending.length === 0) {
      list.innerHTML = '<div class="empty">All caught up</div>';
      return;
    }
    list.innerHTML = pending.map(p => `
      <div class="pending-row">
        <a class="pending-main" href="/categorize?id=${p.id}">
          <div class="pending-amt">Rs ${Number(p.amount).toLocaleString()}</div>
          <div class="pending-info">
            <div class="pending-time">${fmtWhen(p.date, p.time)}</div>
            <div class="pending-hint">Tap to categorize</div>
          </div>
        </a>
        <button class="pending-x" data-id="${p.id}" aria-label="Delete">×</button>
      </div>
    `).join('');

    list.querySelectorAll('.pending-x').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = btn.dataset.id;
        if (!confirm('Remove this transaction?')) return;
        try {
          const res = await fetch(`/api/transaction/${id}`, { method: 'DELETE' });
          if (res.ok) {
            await loadPendingList();
            await refreshPending();
            await loadAll(currentDays);
          } else {
            alert('Failed to remove');
          }
        } catch (err) {
          alert('Failed to remove');
        }
      });
    });
  } catch (err) {
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

inboxBtn.addEventListener('click', () => {
  pendingOverlay.classList.add('open');
  loadPendingList();
});

document.getElementById('pendingClose').addEventListener('click', () => pendingOverlay.classList.remove('open'));
pendingOverlay.addEventListener('click', (e) => { if (e.target === pendingOverlay) pendingOverlay.classList.remove('open'); });

/* ---------- PUSH SUBSCRIPTION ---------- */
const subscribeCard = document.getElementById('subscribeCard');
const subscribeBtn = document.getElementById('subscribeBtn');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();
  if (existing) { subscribeCard.classList.add('hidden'); return; }
  subscribeCard.classList.remove('hidden');
  subscribeBtn.addEventListener('click', async () => {
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'Enabling…';
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { subscribeBtn.disabled = false; subscribeBtn.textContent = 'Enable'; return; }
      const keyRes = await fetch('/vapid-public-key');
      const keyData = await keyRes.json();
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
      });
      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub)
      });
      subscribeCard.classList.add('hidden');
    } catch (err) {
      console.error(err);
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = 'Enable';
    }
  });
}

/* ---------- INIT ---------- */
loadAll(30);
refreshPending();
setInterval(refreshPending, 30000);
initPush();
