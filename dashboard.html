<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#0B0E14" />
<link rel="manifest" href="/manifest.json" />
<title>Kharch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0B0E14;
    --bg-elevated: #131822;
    --bg-subtle: #1A2029;
    --border: #222A36;
    --border-strong: #2E3846;
    --fg: #F5F6F8;
    --fg-muted: #8E8E93;
    --fg-subtle: #5A6472;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-fg: #FFFFFF;
    --danger: #DC2626;

    --c-food: #F97316;
    --c-mart: #22C55E;
    --c-groceries: #14B8A6;
    --c-entertainment: #A855F7;
    --c-shopping: #EC4899;
    --c-bills: #F59E0B;
    --c-transfer: #64748B;
    --c-other: #3B82F6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  button { font-family: inherit; cursor: pointer; }

  .app {
    max-width: 480px;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: none;
    padding: 4px 6px 4px 0;
    border-radius: 10px;
    transition: background 150ms ease;
  }
  .brand:hover { background: rgba(255, 255, 255, 0.04); }
  .brand:active { transform: scale(0.98); }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: var(--accent-fg);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    position: relative;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    border-color: var(--border-strong);
  }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Red dot on inbox icon */
  .icon-btn .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg);
    opacity: 0;
    transform: scale(0);
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .icon-btn.has-pending .badge {
    opacity: 1;
    transform: scale(1);
  }
  .icon-btn.pulse .badge {
    animation: pulse 1s ease-in-out 6;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
    50% { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
  }

  /* ---------- K MENU DROPDOWN ---------- */
  .k-menu {
    position: absolute;
    top: 62px;
    left: 20px;
    min-width: 220px;
    background: #0F131B;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    padding: 6px;
    display: none;
    z-index: 20;
  }
  .k-menu.open { display: block; }

  .k-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 11px 12px;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--fg);
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    transition: background 120ms ease;
  }
  .k-menu-item:hover { background: rgba(255, 255, 255, 0.06); }
  .k-menu-item:active { transform: scale(0.99); }
  .k-menu-item.danger { color: #F87171; }
  .k-menu-item.danger:hover { background: rgba(220, 38, 38, 0.12); }
  .k-menu-icon {
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    opacity: 0.9;
  }

  /* ---------- FIXED TOP ---------- */
  .fixed-top {
    flex-shrink: 0;
    padding: 0 20px;
  }

  .filters {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .filter-btn {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: transparent;
    color: var(--fg-subtle);
    font-size: 13px;
    font-weight: 500;
    border-radius: 9px;
    transition: background 150ms ease, color 150ms ease;
    min-height: 36px;
  }
  .filter-btn:hover { color: var(--fg); }
  .filter-btn.active {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 20px;
    position: relative;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .ring-wrap::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(59, 130, 246, 0.18) 0%,
      rgba(168, 85, 247, 0.10) 35%,
      rgba(236, 72, 153, 0.06) 60%,
      transparent 75%
    );
    filter: blur(20px);
    pointer-events: none;
    z-index: 0;
  }

  .ring-wrap canvas {
    position: relative;
    z-index: 1;
    width: 100% !important;
    height: 100% !important;
    display: block;
    touch-action: none;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
    z-index: 2;
  }

  .ring-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-subtle);
    margin-bottom: 6px;
  }

  .ring-amount {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .tooltip {
    margin-top: 16px;
    min-height: 40px;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 150ms ease;
    font-size: 13px;
    pointer-events: none;
    max-width: 100%;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .tooltip-name { color: var(--fg-muted); font-weight: 500; }
  .tooltip-amount {
    color: var(--fg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .tooltip-percent {
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }

  /* ---------- TRANSACTION SECTION ---------- */
  .tx-section {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 20px 20px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .section-meta {
    font-size: 12px;
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  .tx-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .tx-scroll::-webkit-scrollbar { width: 0; background: transparent; }

  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 20px;
  }

  .tx-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    transition: background 150ms ease, transform 100ms ease;
    position: relative;
  }
  .tx-row:active { background: rgba(255, 255, 255, 0.06); }
  .tx-row.pressing { transform: scale(0.98); }

  .tx-badge {
    width: 40px;
    height: 40px;
    border-radius: 9999px;
    display: grid;
    place-items: center;
    font-size: 17px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
    cursor: pointer;
    transition: transform 100ms ease;
  }
  .tx-badge:active { transform: scale(0.94); }

  .tx-badge[data-cat="Food"]          { background: rgba(249, 115, 22, 0.15); }
  .tx-badge[data-cat="Mart"]          { background: rgba(34, 197, 94, 0.15); }
  .tx-badge[data-cat="Groceries"]     { background: rgba(20, 184, 166, 0.15); }
  .tx-badge[data-cat="Entertainment"] { background: rgba(168, 85, 247, 0.15); }
  .tx-badge[data-cat="Shopping"]      { background: rgba(236, 72, 153, 0.15); }
  .tx-badge[data-cat="Bills"]         { background: rgba(245, 158, 11, 0.15); }
  .tx-badge[data-cat="Transfer"]      { background: rgba(100, 116, 139, 0.15); }
  .tx-badge[data-cat="Other"]         { background: rgba(59, 130, 246, 0.15); }

  .tx-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .tx-cat {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-time {
    font-size: 12px;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }

  .tx-amt {
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .tx-action {
    width: 32px;
    height: 32px;
    border-radius: 9999px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 100ms ease;
  }
  .tx-action:active { transform: scale(0.9); }

  .tx-remove {
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.35);
    color: #F87171;
    font-size: 18px;
    line-height: 1;
  }

  .tx-move {
    background: rgba(37, 99, 235, 0.15);
    border: 1px solid rgba(37, 99, 235, 0.35);
    color: #60A5FA;
  }

  .app.remove-mode .tx-remove { display: grid; }
  .app.move-mode .tx-move { display: grid; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--fg-subtle);
    font-size: 14px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px dashed rgba(255, 255, 255, 0.06);
    border-radius: 16px;
  }

  /* ---------- SUBSCRIBE ---------- */
  .subscribe {
    margin-top: 16px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .subscribe.hidden { display: none; }
  .subscribe-body { flex: 1; min-width: 0; }
  .subscribe-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
  }
  .subscribe-desc {
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.4;
  }
  .subscribe-btn {
    padding: 9px 14px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    min-height: 36px;
    flex-shrink: 0;
  }

  /* ---------- CONTEXT MENU (long-press) ---------- */
  .ctx-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
    z-index: 60;
  }
  .ctx-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .ctx-menu {
    position: fixed;
    min-width: 220px;
    background: rgba(28, 32, 42, 0.95);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    padding: 6px;
    z-index: 70;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 160ms ease, transform 160ms ease;
    pointer-events: none;
  }
  .ctx-menu.open {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .ctx-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 11px 12px;
    background: transparent;
    border: none;
    border-radius: 10px;
    color: var(--fg);
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    transition: background 120ms ease;
    min-height: 44px;
  }
  .ctx-item:hover { background: rgba(255, 255, 255, 0.08); }
  .ctx-item:active { transform: scale(0.99); }
  .ctx-item.danger { color: #F87171; }
  .ctx-item.danger:hover { background: rgba(220, 38, 38, 0.15); }
  .ctx-icon {
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  /* ---------- SHEETS ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: #0F131B;
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 20px 28px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  }

  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    margin: 0 auto 20px;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--fg);
  }
  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }

  .hero-amount {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 0 28px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 24px;
  }
  .hero-amount .prefix {
    font-size: 28px;
    font-weight: 500;
    color: var(--fg-subtle);
  }
  .hero-amount input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    text-align: center;
    width: 100%;
    max-width: 260px;
    font-family: inherit;
  }
  .hero-amount input::placeholder { color: #3A3F4A; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  .cat-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 16px;
    margin: 0 -20px 8px;
    padding-left: 20px;
    padding-right: 20px;
    scrollbar-width: none;
  }
  .cat-chips::-webkit-scrollbar { display: none; }

  .cat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    color: var(--fg-muted);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 150ms ease;
    min-height: 44px;
  }
  .cat-chip:active { transform: scale(0.96); }
  .cat-chip.selected { color: var(--fg); border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); }
  .cat-chip[data-cat="Food"].selected          { background: rgba(249, 115, 22, 0.20); border-color: rgba(249, 115, 22, 0.5); }
  .cat-chip[data-cat="Mart"].selected          { background: rgba(34, 197, 94, 0.20);  border-color: rgba(34, 197, 94, 0.5); }
  .cat-chip[data-cat="Groceries"].selected     { background: rgba(20, 184, 166, 0.20); border-color: rgba(20, 184, 166, 0.5); }
  .cat-chip[data-cat="Entertainment"].selected { background: rgba(168, 85, 247, 0.20); border-color: rgba(168, 85, 247, 0.5); }
  .cat-chip[data-cat="Shopping"].selected      { background: rgba(236, 72, 153, 0.20); border-color: rgba(236, 72, 153, 0.5); }
  .cat-chip[data-cat="Bills"].selected         { background: rgba(245, 158, 11, 0.20); border-color: rgba(245, 158, 11, 0.5); }
  .cat-chip[data-cat="Transfer"].selected      { background: rgba(100, 116, 139, 0.20); border-color: rgba(100, 116, 139, 0.5); }
  .cat-chip[data-cat="Other"].selected         { background: rgba(59, 130, 246, 0.20); border-color: rgba(59, 130, 246, 0.5); }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .row-2 input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--fg);
    font-size: 15px;
    font-family: inherit;
    min-height: 48px;
  }
  .row-2 input:focus { outline: none; border-color: var(--accent); }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-secondary {
    padding: 14px 20px;
    background: transparent;
    border: none;
    color: var(--fg-muted);
    font-size: 15px;
    font-weight: 500;
    min-height: 52px;
    border-radius: 14px;
  }
  .btn-secondary:hover { color: var(--fg); }
  .btn-primary {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: var(--accent-fg);
    font-size: 15px;
    font-weight: 600;
    min-height: 52px;
    transition: background 150ms ease;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- PENDING LIST ---------- */
  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pending-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);

<script>
const COLORS = ['#F97316', '#22C55E', '#14B8A6', '#A855F7', '#EC4899', '#F59E0B', '#64748B', '#3B82F6'];
let chart = null;
let currentDays = 30;
let removeMode = false;
let moveMode = false;

const CAT_EMOJI = {
  Food: '🍔', Mart: '🏪', Groceries: '🛒', Entertainment: '📺',
  Shopping: '🛍️', Bills: '🏠', Transfer: '💸', Other: '❓'
};

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(e => console.log(e));
}

/* ---------- HELPERS ---------- */
function fmtRs(n) {
  return 'Rs ' + Number(n || 0).toLocaleString();
}
function emojiFor(cat) {
  return CAT_EMOJI[cat] || '📌';
}
function fmtWhen(dateStr, timeStr) {
  try {
    const [y, m, d] = dateStr.split('-').map(Number);
    const [hh, mm] = timeStr.split(':').map(Number);
    const dt = new Date(y, m - 1, d, hh, mm);
    const now = new Date();
    const sameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    const t = dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (sameDay(dt, now)) return `Today, ${t}`;
    if (sameDay(dt, yesterday)) return `Yesterday, ${t}`;
    return `${dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, ${t}`;
  } catch (e) {
    return `${dateStr} · ${timeStr}`;
  }
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate(10);
}

/* ---------- CHART + TOOLTIP ---------- */
const tooltipEl = document.getElementById('tooltip');
const tooltipDot = document.getElementById('tooltipDot');
const tooltipName = document.getElementById('tooltipName');
const tooltipAmount = document.getElementById('tooltipAmount');
const tooltipPercent = document.getElementById('tooltipPercent');
let activeIndex = null;

function showTooltip(index) {
  if (!chart) return;
  const label = chart.data.labels[index];
  const value = chart.data.datasets[0].data[index];
  const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
  const pct = total > 0 ? ((value / total) * 100).toFixed(1) : '0';
  tooltipDot.style.background = COLORS[index % COLORS.length];
  tooltipName.textContent = label;
  tooltipAmount.textContent = fmtRs(value);
  tooltipPercent.textContent = pct + '%';
  tooltipEl.classList.add('visible');
  activeIndex = index;
}
function hideTooltip() {
  tooltipEl.classList.remove('visible');
  activeIndex = null;
}
function toggleTooltip(index) {
  if (activeIndex === index) hideTooltip();
  else showTooltip(index);
}

async function loadChart(days) {
  try {
    const res = await fetch(`/api/spending?days=${days}`);
    const data = await res.json();
    document.getElementById('totalAmount').textContent = fmtRs(data.total);
    const ctx = document.getElementById('spendingChart').getContext('2d');
    if (chart) {
      chart.data.labels = data.labels;
      chart.data.datasets[0].data = data.values;
      chart.data.datasets[0].backgroundColor = data.labels.map((_, i) => COLORS[i % COLORS.length]);
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.labels,
          datasets: [{
            data: data.values,
            backgroundColor: data.labels.map((_, i) => COLORS[i % COLORS.length]),
            borderColor: '#0B0E14',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '74%',
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          onClick: (evt, els) => {
            if (els.length > 0) toggleTooltip(els[0].index);
            else hideTooltip();
          }
        }
      });
    }
  } catch (err) {
    console.error(err);
  }
}

/* ---------- TRANSACTIONS ---------- */
let currentTx = [];

async function loadTransactions(days) {
  const list = document.getElementById('transactionList');
  try {
    const res = await fetch(`/api/transactions?days=${days}`);
    const tx = await res.json();
    currentTx = tx;
    document.getElementById('txCount').textContent = tx.length + (tx.length === 1 ? ' entry' : ' entries');
    if (!tx || tx.length === 0) {
      list.innerHTML = '<div class="empty">No transactions yet</div>';
      return;
    }
    list.innerHTML = tx.map(t => `
      <div class="tx-row" data-id="${t.id}">
        <div class="tx-badge" data-cat="${t.category || 'Other'}" data-id="${t.id}">${emojiFor(t.category)}</div>
        <div class="tx-info">
          <div class="tx-cat">${t.category || 'Uncategorized'}</div>
          <div class="tx-time">${fmtWhen(t.date, t.time)}</div>
        </div>
        <div class="tx-amt">${fmtRs(t.amount)}</div>
        <button class="tx-action tx-remove" data-id="${t.id}" aria-label="Remove">×</button>
        <button class="tx-action tx-move" data-id="${t.id}" aria-label="Change category">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    `).join('');

    list.querySelectorAll('.tx-remove').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); deleteTransaction(btn.dataset.id); });
    });
    list.querySelectorAll('.tx-move').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); openMoveSheet(btn.dataset.id); });
    });

    // Long-press on emoji badge
    if (!removeMode && !moveMode) {
      list.querySelectorAll('.tx-badge').forEach(badge => {
        attachLongPress(badge, badge.dataset.id);
      });
    }
  } catch (err) {
    console.error(err);
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

/* ---------- LONG PRESS ---------- */
let longPressTimer = null;
let longPressTarget = null;

function attachLongPress(el, txId) {
  let startX = 0, startY = 0, moved = false;
  let pressTimer = null;
  let triggered = false;

  const start = (e) => {
    if (removeMode || moveMode) return;
    triggered = false;
    const touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX;
    startY = touch.clientY;
    moved = false;

    el.closest('.tx-row')?.classList.add('pressing');

    pressTimer = setTimeout(() => {
      if (!moved) {
        triggered = true;
        haptic();
        openContextMenu(txId, startX, startY);
      }
    }, 1500);
  };

  const move = (e) => {
    const touch = e.touches ? e.touches[0] : e;
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    if (Math.sqrt(dx*dx + dy*dy) > 10) {
      moved = true;
      clearTimeout(pressTimer);
      el.closest('.tx-row')?.classList.remove('pressing');
    }
  };

  const end = () => {
    clearTimeout(pressTimer);
    el.closest('.tx-row')?.classList.remove('pressing');
  };

  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);

  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);

  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ---------- CONTEXT MENU ---------- */
const ctxMenu = document.getElementById('ctxMenu');
const ctxBackdrop = document.getElementById('ctxBackdrop');
const ctxChange = document.getElementById('ctxChange');
const ctxRemove = document.getElementById('ctxRemove');
let ctxTxId = null;

function openContextMenu(txId, x, y) {
  ctxTxId = txId;
  const menuWidth = 220;
  const menuHeight = 110;
  const padding = 12;

  let left = x;
  let top = y;

  if (left + menuWidth + padding > window.innerWidth) left = window.innerWidth - menuWidth - padding;
  if (left < padding) left = padding;
  if (top + menuHeight + padding > window.innerHeight) top = y - menuHeight - 12;
  if (top < padding) top = padding;

  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top = top + 'px';
  ctxMenu.classList.add('open');
  ctxBackdrop.classList.add('open');
}

function closeContextMenu() {
  ctxMenu.classList.remove('open');
  ctxBackdrop.classList.remove('open');
  ctxTxId = null;
}

ctxBackdrop.addEventListener('click', closeContextMenu);
window.addEventListener('scroll', closeContextMenu, true);

ctxChange.addEventListener('click', () => {
  const id = ctxTxId;
  closeContextMenu();
  if (id) openMoveSheet(id);
});

ctxRemove.addEventListener('click', () => {
  const id = ctxTxId;
  closeContextMenu();
  if (id) deleteTransaction(id);
});

/* ---------- DELETE ---------- */
async function deleteTransaction(id) {
  if (!confirm('Remove this transaction?')) return;
  try {
    const res = await fetch(`/api/transaction/${id}`, { method: 'DELETE' });
    if (res.ok) {
      await loadAll(currentDays);
      await refreshPending();
    } else {
      alert('Failed to remove');
    }
  } catch (err) {
    alert('Failed to remove');
  }
}

/* ---------- MOVE SHEET ---------- */
const moveOverlay = document.getElementById('moveOverlay');
let moveTxId = null;

function openMoveSheet(id) {
  const tx = currentTx.find(t => String(t.id) === String(id));
  moveTxId = id;

  if (tx) {
    document.getElementById('moveAmount').textContent = fmtRs(tx.amount);
    document.getElementById('moveMeta').textContent = fmtWhen(tx.date, tx.time);
    document.querySelectorAll('#moveCatChips .cat-chip').forEach(c => {
      c.classList.toggle('selected', c.dataset.cat === tx.category);
    });
  } else {
    document.getElementById('moveAmount').textContent = '—';
    document.getElementById('moveMeta').textContent = '';
  }

  moveOverlay.classList.add('open');
}

function closeMoveSheet() {
  moveOverlay.classList.remove('open');
  moveTxId = null;
}

document.getElementById('moveClose').addEventListener('click', closeMoveSheet);
document.getElementById('moveCancel').addEventListener('click', closeMoveSheet);
moveOverlay.addEventListener('click', (e) => { if (e.target === moveOverlay) closeMoveSheet(); });

document.querySelectorAll('#moveCatChips .cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#moveCatChips .cat-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
});

document.getElementById('moveSave').addEventListener('click', async () => {
  const sel = document.querySelector('#moveCatChips .cat-chip.selected');
  if (!sel || !moveTxId) return;
  const btn = document.getElementById('moveSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await fetch('/api/update_category', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transaction_id: moveTxId, category: sel.dataset.cat })
    });
    closeMoveSheet();
    await loadAll(currentDays);
    await refreshPending();
  } catch (err) {
    alert('Failed to change');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Change category';
  }
});

/* ---------- LOAD ---------- */
async function loadAll(days) {
  currentDays = days;
  await Promise.all([loadChart(days), loadTransactions(days)]);
}

/* ---------- FILTERS ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadAll(parseInt(btn.dataset.days, 10));
  });
});

/* ---------- K MENU ---------- */
const app = document.getElementById('app');
const kMenu = document.getElementById('kMenu');
const brandBtn = document.getElementById('brandBtn');
const menuRemove = document.getElementById('menuRemove');
const menuMove = document.getElementById('menuMove');

function closeKMenu() { kMenu.classList.remove('open'); }

brandBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (kMenu.classList.contains('open')) closeKMenu();
  else kMenu.classList.add('open');
});

document.addEventListener('click', (e) => {
  if (kMenu.classList.contains('open') && !kMenu.contains(e.target) && !brandBtn.contains(e.target)) {
    closeKMenu();
  }
});

menuRemove.addEventListener('click', () => {
  removeMode = !removeMode;
  moveMode = false;
  app.classList.toggle('remove-mode', removeMode);
  app.classList.toggle('move-mode', moveMode);
  closeKMenu();
  loadTransactions(currentDays);
});

menuMove.addEventListener('click', () => {
  moveMode = !moveMode;
  removeMode = false;
  app.classList.toggle('move-mode', moveMode);
  app.classList.toggle('remove-mode', removeMode);
  closeKMenu();
  loadTransactions(currentDays);
});

/* ---------- ADD SHEET ---------- */
const overlay = document.getElementById('overlay');

function openSheet() {
  const now = new Date();
  document.getElementById('mDate').value = now.toISOString().split('T')[0];
  document.getElementById('mTime').value = now.toTimeString().slice(0, 5);
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('mAmount').focus(), 100);
}
function closeSheet() {
  overlay.classList.remove('open');
  document.getElementById('mAmount').value = '';
}
document.getElementById('addBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

document.querySelectorAll('#catChips .cat-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#catChips .cat-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
});

document.getElementById('sheetSave').addEventListener('click', async () => {
  const amount = document.getElementById('mAmount').value;
  const sel = document.querySelector('#catChips .cat-chip.selected');
  const category = sel ? sel.dataset.cat : 'Other';
  const date = document.getElementById('mDate').value;
  const time = document.getElementById('mTime').value;
  if (!amount || !date || !time) { alert('Please fill in amount, date and time.'); return; }
  const btn = document.getElementById('sheetSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/add_transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, category, date, time })
    });
    const data = await res.json();
    if (data.success) {
      closeSheet();
      await loadAll(currentDays);
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
    }
  } catch (err) {
    alert('Failed to save.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

/* ---------- PENDING LIST ---------- */
const inboxBtn = document.getElementById('inboxBtn');
const pendingOverlay = document.getElementById('pendingOverlay');

async function refreshPending() {
  try {
    const res = await fetch('/api/pending');
    const pending = await res.json();
    if (pending && pending.length > 0) {
      const wasHidden = !inboxBtn.classList.contains('has-pending');
      inboxBtn.classList.add('has-pending');
      if (wasHidden) {
        inboxBtn.classList.add('pulse');
        setTimeout(() => inboxBtn.classList.remove('pulse'), 6000);
      }
    } else {
      inboxBtn.classList.remove('has-pending');
      inboxBtn.classList.remove('pulse');
    }
  } catch (err) {
    console.error('Pending check failed:', err);
  }
}

async function loadPendingList() {
  const list = document.getElementById('pendingList');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch('/api/pending');
    const pending = await res.json();
    if (!pending || pending.length === 0) {
      list.innerHTML = '<div class="empty">All caught up</div>';
      return;
    }
    list.innerHTML = pending.map(p => `
      <a class="pending-row" href="/categorize?id=${p.id}">
        <div class="pending-amt">Rs ${Number(p.amount).toLocaleString()}</div>
        <div class="pending-info">
          <div class="pending-time">${fmtWhen(p.date, p.time)}</div>
          <div class="pending-hint">Tap to categorize</div>
        </div>
        <span class="pending-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </a>
    `).join('');
  } catch (err) {
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

inboxBtn.addEventListener('click', () => {
  pendingOverlay.classList.add('open');
  loadPendingList();
});

document.getElementById('pendingClose').addEventListener('click', () => pendingOverlay.classList.remove('open'));
pendingOverlay.addEventListener('click', (e) => { if (e.target === pendingOverlay) pendingOverlay.classList.remove('open'); });

/* ---------- PUSH SUBSCRIPTION ---------- */
const subscribeCard = document.getElementById('subscribeCard');
const subscribeBtn = document.getElementById('subscribeBtn');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();
  if (existing) { subscribeCard.classList.add('hidden'); return; }
  subscribeCard.classList.remove('hidden');
  subscribeBtn.addEventListener('click', async () => {
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'Enabling…';
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { subscribeBtn.disabled = false; subscribeBtn.textContent = 'Enable'; return; }
      const keyRes = await fetch('/vapid-public-key');
      const keyData = await keyRes.json();
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
      });
      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub)
      });
      subscribeCard.classList.add('hidden');
    } catch (err) {
      console.error(err);
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = 'Enable';
    }
  });
}

/* ---------- INIT ---------- */
loadAll(30);
refreshPending();
setInterval(refreshPending, 30000);
initPush();
