<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#09090B" />
<link rel="manifest" href="/manifest.json" />
<title>Kharch AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #09090B;
    --bg-elevated: #111113;
    --bg-subtle: #17171A;
    --border: #232326;
    --border-strong: #2E2E32;
    --fg: #FAFAFA;
    --fg-muted: #A1A1AA;
    --fg-subtle: #71717A;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-fg: #FFFFFF;
    --success: #16A34A;
    --danger: #DC2626;
    --warning: #D97706;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-feature-settings: 'ss01', 'cv01';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* ---------- LAYOUT ---------- */
  .app {
    max-width: 480px;
    width: 100%;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: var(--accent-fg);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .pending {
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.pending.hidden {
  display: none;
}
.pending-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}
.pending-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.005em;
}
.pending-count {
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  background: rgba(37, 99, 235, 0.12);
  padding: 2px 8px;
  border-radius: 10px;
}
.pending-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pending-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  text-decoration: none;
  transition: background 150ms ease, border-color 150ms ease;
}
.pending-item:hover {
  background: var(--bg-subtle);
  border-color: var(--border-strong);
}
.pending-item:active {
  transform: scale(0.99);
}
.pending-amt {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.pending-meta {
  font-size: 12px;
  color: var(--fg-subtle);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
  font-family: 'Geist Mono', ui-monospace, monospace;
}
.pending-arrow {
  color: var(--fg-subtle);
  flex-shrink: 0;
}

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .icon-btn:hover {
    background: var(--bg-subtle);
    color: var(--fg);
    border-color: var(--border-strong);
  }
  .icon-btn:active {
    transform: scale(0.98);
  }
  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- SCROLL AREA ---------- */
  .scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 20px 24px;
  }
  .scroll::-webkit-scrollbar {
    width: 0;
    background: transparent;
  }

  /* ---------- FILTERS ---------- */
  .filters {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
  }

  .filter-btn {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: transparent;
    color: var(--fg-subtle);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    border-radius: 7px;
    transition: background 150ms ease, color 150ms ease;
    min-height: 36px;
  }
  .filter-btn:hover {
    color: var(--fg);
  }
  .filter-btn.active {
    background: var(--bg-subtle);
    color: var(--fg);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .filter-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  /* ---------- RING (centered) ---------- */
  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 28px;
  }

  .ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
  }
  .ring-wrap canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    touch-action: none;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }

  .ring-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-subtle);
    margin-bottom: 6px;
  }

  .ring-amount {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TOOLTIP ---------- */
  .tooltip {
    margin-top: 20px;
    min-height: 44px;
    padding: 10px 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 150ms ease;
    font-size: 14px;
    pointer-events: none;
    max-width: 100%;
  }
  .tooltip.visible {
    opacity: 1;
  }
  .tooltip-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .tooltip-name {
    color: var(--fg-muted);
    font-weight: 500;
  }
  .tooltip-amount {
    color: var(--fg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .tooltip-percent {
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  /* ---------- SECTION HEADER ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--fg);
  }

  .section-meta {
    font-size: 12px;
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- TRANSACTION LIST ---------- */
  .tx-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }

  .tx-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--border);
    transition: background 120ms ease;
  }
  .tx-row:active {
    background: var(--bg-elevated);
  }

  .tx-badge {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg-subtle);
    display: grid;
    place-items: center;
    font-size: 16px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .tx-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .tx-cat {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-time {
    font-size: 12px;
    color: var(--fg-subtle);
    font-variant-numeric: tabular-nums;
    font-family: 'Geist Mono', ui-monospace, monospace;
  }

  .tx-amt {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  /* ---------- EMPTY / LOADING ---------- */
  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--fg-subtle);
    font-size: 14px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  /* ---------- SUBSCRIBE BANNER ---------- */
  .subscribe {
    margin-top: 24px;
    padding: 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .subscribe.hidden {
    display: none;
  }
  .subscribe-body {
    flex: 1;
    min-width: 0;
  }
  .subscribe-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
    letter-spacing: -0.005em;
  }
  .subscribe-desc {
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.4;
  }
  .subscribe-btn {
    padding: 9px 14px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.005em;
    transition: background 150ms ease;
    min-height: 36px;
    flex-shrink: 0;
  }
  .subscribe-btn:hover {
    background: var(--accent-hover);
  }
  .subscribe-btn:active {
    transform: scale(0.98);
  }
  .subscribe-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---------- MODAL ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(2px);
  }
  .overlay.open {
    display: flex;
  }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--bg-elevated);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    border-top: 1px solid var(--border);
    padding: 20px 20px 28px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-muted);
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
  }
  .sheet-close:hover {
    background: var(--bg-subtle);
    color: var(--fg);
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    margin-bottom: 6px;
    letter-spacing: 0.005em;
  }
  .field input,
  .field select {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 15px;
    font-family: inherit;
    transition: border-color 150ms ease;
    min-height: 44px;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field input::placeholder {
    color: var(--fg-subtle);
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg-muted);
    font-size: 14px;
    font-weight: 500;
    min-height: 44px;
  }
  .btn-secondary:hover {
    background: var(--bg-subtle);
    color: var(--fg);
  }
  .btn-primary {
    flex: 2;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 600;
    min-height: 44px;
    transition: background 150ms ease;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
  }
  .btn-primary:active {
    transform: scale(0.99);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 400px) {
    .ring-wrap { width: 200px; height: 200px; }
    .ring-amount { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">K</div>
      <span class="brand-name">Kharch</span>
    </div>
    <button class="icon-btn" id="addBtn" aria-label="Add transaction">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </header>

  <main class="scroll">

    <div class="filters" role="tablist" aria-label="Time range">
      <button class="filter-btn" data-days="7" role="tab">1W</button>
      <button class="filter-btn" data-days="14" role="tab">2W</button>
      <button class="filter-btn active" data-days="30" role="tab">4W</button>
      <button class="filter-btn" data-days="90" role="tab">3M</button>
    </div>

    <section class="ring-section">
      <div class="ring-wrap">
        <canvas id="spendingChart"></canvas>
        <div class="ring-center">
          <div class="ring-label">Total spent</div>
          <div class="ring-amount" id="totalAmount">Rs 0</div>
        </div>
      </div>
      <div class="tooltip" id="tooltip">
        <span class="tooltip-dot" id="tooltipDot"></span>
        <span class="tooltip-name" id="tooltipName">—</span>
        <span class="tooltip-amount" id="tooltipAmount">Rs 0</span>
        <span class="tooltip-percent" id="tooltipPercent"></span>
      </div>
    </section>

    <div class="pending hidden" id="pendingCard">
  <div class="pending-head">
    <span class="pending-title">Uncategorized</span>
    <span class="pending-count" id="pendingCount">0</span>
  </div>
  <div class="pending-list" id="pendingList"></div>
</div>

    <div class="section-head">
      <span class="section-title">Transactions</span>
      <span class="section-meta" id="txCount">0</span>
    </div>

    <div class="tx-list" id="transactionList">
      <div class="empty">Loading…</div>
    </div>

    <div class="subscribe hidden" id="subscribeCard">
      <div class="subscribe-body">
        <div class="subscribe-title">Enable notifications</div>
        <div class="subscribe-desc">Get notified when a new transaction arrives so you can categorize it right away.</div>
      </div>
      <button class="subscribe-btn" id="subscribeBtn">Enable</button>
    </div>

  </main>

</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">Add transaction</span>
      <button class="sheet-close" id="sheetClose" aria-label="Close">×</button>
    </div>

    <div class="field">
      <label for="mAmount">Amount (Rs)</label>
      <input type="number" id="mAmount" inputmode="decimal" step="0.01" placeholder="0.00" />
    </div>

    <div class="field">
      <label for="mCategory">Category</label>
      <select id="mCategory">
        <option value="Food">Food</option>
        <option value="Fuel">Fuel</option>
        <option value="Groceries">Groceries</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Transfer">Transfer</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="mDate">Date</label>
        <input type="date" id="mDate" />
      </div>
      <div class="field">
        <label for="mTime">Time</label>
        <input type="time" id="mTime" />
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn-secondary" id="sheetCancel">Cancel</button>
      <button class="btn-primary" id="sheetSave">Save</button>
    </div>
  </div>
</div>

<script>
    async function loadPending() {
  try {
    const res = await fetch('/api/pending');
    const pending = await res.json();
    const card = document.getElementById('pendingCard');
    const list = document.getElementById('pendingList');
    const count = document.getElementById('pendingCount');

    if (!pending || pending.length === 0) {
      card.classList.add('hidden');
      return;
    }

    card.classList.remove('hidden');
    count.textContent = pending.length;

    list.innerHTML = pending.map(p => `
      <a class="pending-item" href="/categorize?id=${p.id}">
        <span class="pending-amt">Rs ${Number(p.amount).toLocaleString()}</span>
        <span class="pending-meta">${p.date} · ${p.time}</span>
        <span class="pending-arrow">›</span>
      </a>
    `).join('');
  } catch (err) {
    console.error('Pending error:', err);
  }
}
const COLORS = ['#2563EB', '#0891B2', '#16A34A', '#D97706', '#DC2626', '#7C3AED', '#DB2777', '#059669', '#4F46E5', '#CA8A04'];
let chart = null;
let currentDays = 30;

const CAT_EMOJI = {
  Food: '🍔', Fuel: '⛽', Groceries: '🛒', Entertainment: '📺',
  Shopping: '🛍️', Bills: '🏠', Transfer: '💸', Other: '❓'
};

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js')
    .then(r => console.log('SW registered'))
    .catch(e => console.log('SW failed', e));
}

/* ---------- HELPERS ---------- */
function fmtRs(n) {
  return 'Rs ' + Number(n || 0).toLocaleString();
}

function emojiFor(cat) {
  return CAT_EMOJI[cat] || '📌';
}

/* ---------- CHART ---------- */
const tooltipEl = document.getElementById('tooltip');
const tooltipDot = document.getElementById('tooltipDot');
const tooltipName = document.getElementById('tooltipName');
const tooltipAmount = document.getElementById('tooltipAmount');
const tooltipPercent = document.getElementById('tooltipPercent');

function showTooltip(label, value, total, index) {
  const pct = total > 0 ? ((value / total) * 100).toFixed(1) : '0';
  tooltipDot.style.background = COLORS[index % COLORS.length];
  tooltipName.textContent = label;
  tooltipAmount.textContent = fmtRs(value);
  tooltipPercent.textContent = pct + '%';
  tooltipEl.classList.add('visible');
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

async function loadChart(days) {
  try {
    const res = await fetch(`/api/spending?days=${days}`);
    const data = await res.json();

    document.getElementById('totalAmount').textContent = fmtRs(data.total);

    const ctx = document.getElementById('spendingChart').getContext('2d');

    if (chart) {
      chart.data.labels = data.labels;
      chart.data.datasets[0].data = data.values;
      chart.data.datasets[0].backgroundColor = data.labels.map((_, i) => COLORS[i % COLORS.length]);
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.labels,
          datasets: [{
            data: data.values,
            backgroundColor: data.labels.map((_, i) => COLORS[i % COLORS.length]),
            borderColor: '#111113',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '74%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          onHover: (evt, els) => {
            if (els.length > 0) {
              const i = els[0].index;
              const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
              showTooltip(chart.data.labels[i], chart.data.datasets[0].data[i], total, i);
            } else {
              hideTooltip();
            }
          }
        }
      });
    }
  } catch (err) {
    console.error('Chart error:', err);
    document.getElementById('totalAmount').textContent = 'Err';
  }
}

/* ---------- TRANSACTIONS ---------- */
async function loadTransactions(days) {
  const list = document.getElementById('transactionList');
  try {
    const res = await fetch(`/api/transactions?days=${days}`);
    const tx = await res.json();

    document.getElementById('txCount').textContent = tx.length + (tx.length === 1 ? ' entry' : ' entries');

    if (!tx || tx.length === 0) {
      list.innerHTML = '<div class="empty">No transactions yet</div>';
      return;
    }

    list.innerHTML = tx.map(t => `
      <div class="tx-row">
        <div class="tx-badge">${emojiFor(t.category)}</div>
        <div class="tx-info">
          <div class="tx-cat">${t.category || 'Uncategorized'}</div>
          <div class="tx-time">${t.date} · ${t.time}</div>
        </div>
        <div class="tx-amt">${fmtRs(t.amount)}</div>
      </div>
    `).join('');
  } catch (err) {
    console.error('Tx error:', err);
    list.innerHTML = '<div class="empty">Could not load</div>';
  }
}

/* ---------- LOAD ---------- */
async function loadAll(days) {
  currentDays = days;
  await Promise.all([loadChart(days), loadTransactions(days), loadPending()]);
}

/* ---------- FILTERS ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadAll(parseInt(btn.dataset.days, 10));
  });
});

/* ---------- MODAL ---------- */
const overlay = document.getElementById('overlay');

function openSheet() {
  const now = new Date();
  document.getElementById('mDate').value = now.toISOString().split('T')[0];
  document.getElementById('mTime').value = now.toTimeString().slice(0, 5);
  overlay.classList.add('open');
}

function closeSheet() {
  overlay.classList.remove('open');
  document.getElementById('mAmount').value = '';
}

document.getElementById('addBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetCancel').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeSheet(); });

document.getElementById('sheetSave').addEventListener('click', async () => {
  const amount = document.getElementById('mAmount').value;
  const category = document.getElementById('mCategory').value;
  const date = document.getElementById('mDate').value;
  const time = document.getElementById('mTime').value;

  if (!amount || !date || !time) {
    alert('Please fill in amount, date and time.');
    return;
  }

  const btn = document.getElementById('sheetSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch('/api/add_transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, category, date, time })
    });
    const data = await res.json();
    if (data.success) {
      closeSheet();
      await loadAll(currentDays);
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
    }
  } catch (err) {
    alert('Failed to save.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

/* ---------- PUSH SUBSCRIPTION ---------- */
const subscribeCard = document.getElementById('subscribeCard');
const subscribeBtn = document.getElementById('subscribeBtn');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();

  if (existing) {
    subscribeCard.classList.add('hidden');
    return;
  }

  subscribeCard.classList.remove('hidden');

  subscribeBtn.addEventListener('click', async () => {
    subscribeBtn.disabled = true;
    subscribeBtn.textContent = 'Enabling…';

    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        subscribeBtn.disabled = false;
        subscribeBtn.textContent = 'Enable';
        return;
      }

      const keyRes = await fetch('/vapid-public-key');
      const keyData = await keyRes.json();

      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
      });

      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub)
      });

      subscribeCard.classList.add('hidden');
    } catch (err) {
      console.error('Push subscribe failed:', err);
      subscribeBtn.disabled = false;
      subscribeBtn.textContent = 'Enable';
    }
  });
}

/* ---------- INIT ---------- */
loadAll(30);
initPush();
</script>
